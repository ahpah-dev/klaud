<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Klaud — local coding agent</title>
<meta name="description" content="A local coding agent you can point at any OpenAI-compatible API. Bring your own key." />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#1f1e1d" media="(prefers-color-scheme: dark)" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/styles.css" />
<script>
  // Apply the stored theme before first paint to avoid a flash.
  try {
    var t = localStorage.getItem('klaud.theme');
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>
<body>

<!-- ===================== icon sprite ===================== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <!-- Klaud mark: a K built from two diagonals meeting a vertical stem, with
         the upper arm drawn as a solid shape so the mark reads as a faceted
         gem rather than a letterform. Drawn for this app. -->

      <path d="M6.4 3.4h2.9v7.5l5.5-7.5h3.4l-6 8.1 6.3 8.7h-3.5l-5.7-7.9v7.9H6.4z" fill="currentColor"/>
      <path d="M14.9 2.6 21.2 8.9 14.9 15.2 8.6 8.9z" fill="currentColor" opacity=".22"/>
      <path d="M17.9 8.9 14.8 12 17.9 15.1 21 12z" fill="currentColor" opacity=".55"/>
    </symbol>
    <symbol id="i-gift" viewBox="0 0 24 24"><path d="M4 10.4h16V20a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M3 7h18v3.4H3zM12 7v14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 7S10.6 3 8.6 3a2 2 0 0 0 0 4zM12 7s1.4-4 3.4-4a2 2 0 0 1 0 4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-zap" viewBox="0 0 24 24"><path d="M13.4 2.6 5 13.4h5.3l-.7 8 8.4-10.8h-5.3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-8.5 8.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 14.5V19a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>

    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="16" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="10" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.8h6V7M6.5 7l.8 12.2A1.8 1.8 0 0 0 9.1 21h5.8a1.8 1.8 0 0 0 1.8-1.8L17.5 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7.2A1.7 1.7 0 0 1 5.2 5.5h3.6l1.9 2.2h8.1a1.7 1.7 0 0 1 1.7 1.7v7.4a1.7 1.7 0 0 1-1.7 1.7H5.2a1.7 1.7 0 0 1-1.7-1.7z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4 17 7M7 17l-1.6 1.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.2A8.4 8.4 0 0 1 9.8 4a8.4 8.4 0 1 0 10.2 10.2z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>

    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.8 9.6 17.4 19 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M9.2 9.2l5.6 5.6M14.8 9.2l-5.6 5.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-spinner" viewBox="0 0 24 24"><path d="M12 3.4a8.6 8.6 0 1 0 8.6 8.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2.4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7.4 10l2.4 2.2-2.4 2.2M12.6 14.6h4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M13.4 3.5H7.2A1.7 1.7 0 0 0 5.5 5.2v13.6a1.7 1.7 0 0 0 1.7 1.7h9.6a1.7 1.7 0 0 0 1.7-1.7V8.6z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M13.4 3.5v5.1h5.1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4.5 19.5h3.2l9.6-9.6-3.2-3.2-9.6 9.6zM15.4 4.6l1.4-1.4a1.5 1.5 0 0 1 2.1 0l1.9 1.9a1.5 1.5 0 0 1 0 2.1l-1.4 1.4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.6" cy="10.6" r="6.1" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M15.2 15.2 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M4.5 7h15M4.5 12h15M4.5 17h9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3.6 12h16.8M12 3.4c2.3 2.3 3.5 5.4 3.5 8.6S14.3 18.3 12 20.6c-2.3-2.3-3.5-5.4-3.5-8.6S9.7 5.7 12 3.4z" fill="none" stroke="currentColor" stroke-width="1.4"/></symbol>
    <symbol id="i-brain" viewBox="0 0 24 24"><path d="M12 5.4a3 3 0 0 0-5.4 1.8c-1.5.4-2.4 1.7-2.4 3.2 0 .9.3 1.7.9 2.3-.5.5-.8 1.3-.8 2.1A3.1 3.1 0 0 0 7.9 18c.6 1 1.9 1.6 3.2 1.2z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M12 5.4a3 3 0 0 1 5.4 1.8c1.5.4 2.4 1.7 2.4 3.2 0 .9-.3 1.7-.9 2.3.5.5.8 1.3.8 2.1A3.1 3.1 0 0 1 16.1 18c-.6 1-1.9 1.6-3.2 1.2z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M12 5.4v13.8" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3.2 19 6v5.9c0 4-3 7.3-7 8.9-4-1.6-7-4.9-7-8.9V6z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 12.2l2.2 2.2L15.3 10" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8.2" cy="15.8" r="3.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.9 13.1 19 5M16 8l2 2M14 10l2 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-plug" viewBox="0 0 24 24"><path d="M9 4v5M15 4v5M6.5 9h11v3.2a5.5 5.5 0 0 1-11 0zM12 17.7V21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 11v5.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="7.9" r="1.1" fill="currentColor"/></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 4.2 21 19.4H3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 9.6v4.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="16.9" r="1" fill="currentColor"/></symbol>
    <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3.2" y="4.4" width="17.6" height="15.2" rx="2.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M9.6 4.4v15.2" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.6l2.6 5.4 5.9.8-4.3 4.1 1 5.9-5.2-2.8-5.2 2.8 1-5.9L3.5 9.8l5.9-.8z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3.4l1.9 5.3 5.3 1.9-5.3 1.9L12 17.8l-1.9-5.3L4.8 10.6l5.3-1.9z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M18.6 16.4l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z" fill="currentColor"/></symbol>
  </defs>
</svg>

<div class="app">
  <!-- ===================== sidebar ===================== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="brand">
        <svg aria-hidden="true"><use href="#i-mark"/></svg>
        <span>Klaud</span>
      </div>
      <button class="icon-btn sidebar-collapse" id="collapse-sidebar" aria-label="Hide sidebar">
        <svg aria-hidden="true"><use href="#i-panel"/></svg>
      </button>
    </div>

    <div class="sidebar-actions">
      <button class="nav-btn primary" id="new-chat">
        <svg aria-hidden="true"><use href="#i-plus"/></svg>
        New chat
      </button>
    </div>

    <div class="sidebar-label">Chats and tasks</div>
    <div class="chat-list" id="chat-list"></div>

    <div class="sidebar-foot">
      <button class="workspace-chip" id="workspace-chip" title="Change working directory, or create a new folder">
        <svg aria-hidden="true"><use href="#i-folder"/></svg>
        <span class="ws-path" id="ws-path">…</span>
      </button>
    </div>
  </aside>

  <!-- ===================== main ===================== -->
  <main class="main">
    <header class="topbar">
      <button class="icon-btn sidebar-reveal" id="toggle-sidebar" aria-label="Show sidebar" aria-expanded="false">
        <svg aria-hidden="true"><use href="#i-panel"/></svg>
      </button>
      <div class="spacer"></div>
      <button class="icon-btn" id="open-free" title="Browse free, no-card providers" aria-label="Free providers">
        <svg aria-hidden="true"><use href="#i-gift"/></svg>
      </button>
      <button class="icon-btn" id="open-settings-top" title="Settings" aria-label="Settings">
        <svg aria-hidden="true"><use href="#i-settings"/></svg>
      </button>
      <button class="icon-btn" id="toggle-theme" aria-label="Toggle theme">
        <svg aria-hidden="true" id="theme-icon"><use href="#i-moon"/></svg>
      </button>
    </header>

    <div class="centre-group">
      <div class="scroller" id="scroller">
        <div class="scroller-inner" id="messages"></div>
      </div>

      <div class="composer-wrap">
        <div class="composer">
          <!-- Skills, offered as you type "/" — the same discovery path Claude has.
               A listbox rather than a div: the arrow keys move a real selection and
               screen readers announce it. -->
          <div class="skill-menu" id="skill-menu" role="listbox" aria-label="Skills" hidden></div>
          <div class="prompt-field">
            <textarea id="prompt" rows="1" aria-label="Message Klaud" autocomplete="off" spellcheck="true"></textarea>
            <!-- The hint is an overlay, not the textarea's `placeholder` attribute:
                 an attribute cannot crossfade, and the two lines have to overlap
                 during the transition. `aria-hidden` because the textarea already
                 carries an accessible label; announcing both would say it twice. -->
            <div class="prompt-hint" id="prompt-hint" aria-hidden="true">
              <span class="hint-line is-on">Type / for skills</span>
              <span class="hint-line">How can I help you today?</span>
            </div>
          </div>
          <div class="composer-row">
            <!-- Chat and Cowork share this one composer, so the mode is a small
                 segmented control sitting with the other chips rather than a
                 second screen. A radiogroup, not a div: Tab reaches it and both
                 Enter and Space activate a segment. -->
            <div class="mode-toggle" id="mode-toggle" role="radiogroup" aria-label="Mode: chat or Cowork">
              <button type="button" class="mode-seg" id="mode-chat" data-mode="chat" role="radio" aria-checked="true">Chat</button>
              <button type="button" class="mode-seg" id="mode-cowork" data-mode="cowork" role="radio" aria-checked="false">Cowork</button>
            </div>
            <button class="chip-select" id="composer-mode" title="Tool permissions">
              <svg aria-hidden="true"><use href="#i-shield"/></svg>
              <span id="composer-mode-label">auto</span>
            </button>
            <button class="chip-select" id="composer-workspace" title="Working directory">
              <svg aria-hidden="true"><use href="#i-folder"/></svg>
              <span id="composer-ws-label">…</span>
            </button>
            <div class="grow"></div>
            <button class="chip-select model-chip" id="model-pill" title="Change model">
              <span class="dot off" id="model-dot"></span>
              <span class="name" id="model-name">no model</span>
              <svg aria-hidden="true" class="chev"><use href="#i-chevron"/></svg>
            </button>
            <button class="send-btn" id="send" aria-label="Send" disabled>
              <svg aria-hidden="true" id="send-icon"><use href="#i-send"/></svg>
            </button>
          </div>
        </div>
        <div class="composer-hint" id="composer-hint">
          Enter to send · Shift+Enter for a new line · Klaud runs real commands in your working directory
        </div>
      </div>
    </div>
  </main>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="modal-root"></div>

<script type="module" src="/app.js"></script>
</body>
</html>
